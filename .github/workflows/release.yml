name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build Linux binary
        run: cd src && go build -trimpath -ldflags="-s -w -X github.com/gukak/GoogleTakeOutBack/internal/app.Version=${GITHUB_REF_NAME}" -o ../TakeOutBack/tools/linux/takeoutback ./cmd/takeoutback
      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: takeoutback-linux-amd64
          path: TakeOutBack/tools/linux/takeoutback
          if-no-files-found: error

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build Windows binary
        run: cd src && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -X github.com/gukak/GoogleTakeOutBack/internal/app.Version=${GITHUB_REF_NAME}" -o ../TakeOutBack/tools/windows/takeoutback.exe ./cmd/takeoutback
      - name: Upload Windows binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: takeoutback-windows-amd64.exe
          path: TakeOutBack/tools/windows/takeoutback.exe
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: takeoutback-linux-amd64
          path: TakeOutBack/tools/linux/

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: takeoutback-windows-amd64.exe
          path: TakeOutBack/tools/windows/

      - name: Make Linux binary executable
        run: chmod +x TakeOutBack/tools/linux/takeoutback

      - name: Verify binaries
        run: |
          test -f TakeOutBack/tools/linux/takeoutback
          test -f TakeOutBack/tools/windows/takeoutback.exe
          echo "Linux version:"
          TakeOutBack/tools/linux/takeoutback --version
          echo "Windows file size:"
          ls -lh TakeOutBack/tools/windows/takeoutback.exe

      - name: Generate checksums
        run: |
          cd TakeOutBack/tools/linux
          sha256sum takeoutback > takeoutback.sha256
          cd ../windows
          sha256sum takeoutback.exe > takeoutback.exe.sha256

      - name: Template release version into installers
        run: |
          TAG="${GITHUB_REF_NAME}"
          sed -i "s|TAKEOUTBACK_VERSION:-v[0-9][0-9a-zA-Z.]*|TAKEOUTBACK_VERSION:-${TAG}|" TakeOutBack/scripts/install.sh
          sed -i "s|Version = \"v[0-9][0-9a-zA-Z.]*\"|Version = \"${TAG}\"|" TakeOutBack/scripts/install.ps1
          echo "Templated installers to ${TAG}"
          grep -n "TAKEOUTBACK_VERSION:-" TakeOutBack/scripts/install.sh
          grep -n 'Version = "' TakeOutBack/scripts/install.ps1

      - name: Create release assets directory
        run: |
          mkdir -p dist
          cp TakeOutBack/tools/linux/takeoutback dist/takeoutback-linux-amd64
          cp TakeOutBack/tools/linux/takeoutback.sha256 dist/takeoutback-linux-amd64.sha256
          cp TakeOutBack/tools/windows/takeoutback.exe dist/takeoutback-windows-amd64.exe
          cp TakeOutBack/tools/windows/takeoutback.exe.sha256 dist/takeoutback-windows-amd64.exe.sha256
          cp takeOutBack.sh dist/takeOutBack.sh
          cp takeOutBack.bat dist/takeOutBack.bat
          cp TakeOutBack/scripts/install.sh dist/install.sh
          cp TakeOutBack/scripts/install.ps1 dist/install.ps1
          cp TakeOutBack/config/settings.json dist/settings.json
          cp TakeOutBack/config/policy.json dist/policy.json
          cp README.md dist/README.md
          cp docs/Architecture.md dist/Architecture.md
          cp docs/Installation.md dist/Installation.md
          cp docs/Usage.md dist/Usage.md
          cp docs/Development.md dist/Development.md
          cp docs/Troubleshooting.md dist/Troubleshooting.md
          cp CHANGELOG.md dist/CHANGELOG.md

      - name: List release assets
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
