name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vet-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Vet
        run: cd src && go vet ./...
      - name: Test
        run: cd src && go test ./...

  build-linux:
    runs-on: ubuntu-latest
    needs: vet-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build Linux binary
        run: cd src && go build -trimpath -ldflags="-s -w" -o ../TakeOutBack/tools/linux/takeoutback ./cmd/takeoutback
      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: takeoutback-linux-amd64
          path: TakeOutBack/tools/linux/takeoutback

  build-windows:
    runs-on: ubuntu-latest
    needs: vet-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build Windows binary
        run: cd src && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../TakeOutBack/tools/windows/takeoutback.exe ./cmd/takeoutback
      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: takeoutback-windows-amd64.exe
          path: TakeOutBack/tools/windows/takeoutback.exe
